name: tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System deps (ffmpeg for shot segmentation, redis for serving tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg redis-server
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install
        run: uv sync --extra dev --extra editing --extra serving
      - name: Lint (new modules)
        run: uv run ruff check pixelle_video/reliability pixelle_video/serving pixelle_video/editing pixelle_video/testing tests benchmarks
      - name: Test
        run: uv run pytest -q
